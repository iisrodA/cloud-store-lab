# App Engine Standard deployment — replace REPLACE_ME values with your project's.
# Deploy from this directory: `gcloud app deploy app.yaml`
runtime: python311

entrypoint: gunicorn -w 2 -k uvicorn.workers.UvicornWorker main:app

env_variables:
  GOOGLE_CLOUD_PROJECT: "computacion-en-la-nube-489021"
  # Cloud SQL — INSTANCE_CONNECTION_NAME drives the Unix-socket connection in database.py.
  INSTANCE_CONNECTION_NAME: "computacion-en-la-nube-489021:us-central1:fastapi-db"
  DB_NAME: "cloudgames"
  DB_USER: "postgres"
  DB_PASSWORD: "compUt@nUb3"
  # Cloud Storage
  GCS_BUCKET_NAME: "cloudgames-storage-489021"
  # Firestore
  FIRESTORE_COLLECTION_AUDIT_EVENTS: "audit_events"

# Mounts the Cloud SQL socket at /cloudsql/<INSTANCE_CONNECTION_NAME>.
beta_settings:
  cloud_sql_instances: "computacion-en-la-nube-489021:us-central1:fastapi-db"

handlers:
  - url: /.*
    script: auto
    secure: always
